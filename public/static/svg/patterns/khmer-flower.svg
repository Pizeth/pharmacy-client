<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1336 1336" width="100%" height="100%" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Khmer flower motif</title>
  <defs>
    <!-- Right half of the upward petal; mirrored to make the full petal -->
    <g id="half">
      <!-- outer lobe with curl -->
      <path d="M965,5 C1030,65 1090,130 1130,190 C1175,260 1195,340 1165,400 C1155,420 1145,425 1140,422 C1120,405 1100,410 1095,435 C1090,462 1125,478 1155,458 C1200,430 1222,360 1195,260 C1185,225 1170,200 1160,190 C1200,215 1270,300 1285,400 C1300,500 1296,600 1262,662 C1238,705 1195,732 1150,745 L1130,752"/>
      <!-- middle petal -->
      <path d="M965,335 C990,372 1035,445 1082,522 C1128,598 1138,665 1112,735"/>
      <path d="M965,430 C995,462 1040,540 1056,590 C1072,645 1062,680 1040,703"/>
    </g>
    <g id="petal">
      <use href="#half"/>
      <use href="#half" transform="translate(1930,0) scale(-1,1)"/>
    </g>
    <!-- Corner leaflet: open path, mirror-symmetric about the diagonal (x,y swapped), slightly pointed tip -->
    <path id="corner" d="M636,488 C580,478 535,472 505,472 C492,472 484,472 478,478 C472,484 472,492 472,505 C472,535 478,580 488,636"/>
  </defs>

  <!-- Four scaled motifs per tile, matching the Rumduol pattern density. -->
  <defs>
  <g id="khmer-flower-motif" transform="scale(0.3461139896373057)" fill="none" stroke="#ff0000" stroke-width="9" stroke-linecap="round" stroke-linejoin="miter" stroke-miterlimit="12">
    <g id="petals">
      <use href="#petal"/>
      <use href="#petal" transform="rotate(90 965 965)"/>
      <use href="#petal" transform="rotate(180 965 965)"/>
      <use href="#petal" transform="rotate(270 965 965)"/>
    </g>
    <use href="#corner"/>
    <use href="#corner" transform="rotate(90 965 965)"/>
    <use href="#corner" transform="rotate(180 965 965)"/>
    <use href="#corner" transform="rotate(270 965 965)"/>

    <!-- center rings -->
    <circle cx="965" cy="965" r="270"/>
    <circle cx="965" cy="965" r="195"/>
  </g>
  </defs>
  <use href="#khmer-flower-motif"/>
  <use href="#khmer-flower-motif" x="668"/>
  <use href="#khmer-flower-motif" y="668"/>
  <use href="#khmer-flower-motif" x="668" y="668"/>
</svg>
