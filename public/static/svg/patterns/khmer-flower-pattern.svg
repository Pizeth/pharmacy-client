<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1336 1336" width="100%" height="100%" xmlns:c2pa="http://c2pa.org/manifest">
  <title>Khmer flower pattern</title>
  <defs>
    <!-- Right half of the upward petal; mirrored to make the full petal -->
    <g id="half">
      <path d="M965,5 C1030,65 1090,130 1130,190 C1175,260 1195,340 1165,400 C1155,420 1145,425 1140,422 C1120,405 1100,410 1095,435 C1090,462 1125,478 1155,458 C1200,430 1222,360 1195,260 C1186,225 1172,203 1165,194 C1160,187 1164,183 1170,187 C1205,212 1270,300 1285,400 C1300,500 1296,600 1262,662 C1238,705 1195,732 1150,745 L1130,752"/>
      <path d="M965,335 C990,372 1035,445 1082,522 C1128,598 1138,665 1112,735"/>
      <path d="M965,430 C995,462 1040,540 1056,590 C1072,645 1062,680 1040,703"/>
    </g>
    <g id="petal">
      <use href="#half"/>
      <use href="#half" transform="translate(1930,0) scale(-1,1)"/>
    </g>
    <path id="corner" d="M636,488 C580,478 535,472 505,472 C492,472 484,472 478,478 C472,484 472,492 472,505 C472,535 478,580 488,636"/>

    <!-- Big flower (drawn at 1930 x 1930, centre 965,965) -->
    <g id="khmer-flower-motif" fill="none" stroke="#ff0000" stroke-width="9" stroke-linecap="round" stroke-linejoin="miter" stroke-miterlimit="12">
      <use href="#petal"/>
      <use href="#petal" transform="rotate(90 965 965)"/>
      <use href="#petal" transform="rotate(180 965 965)"/>
      <use href="#petal" transform="rotate(270 965 965)"/>
      <use href="#corner"/>
      <use href="#corner" transform="rotate(90 965 965)"/>
      <use href="#corner" transform="rotate(180 965 965)"/>
      <use href="#corner" transform="rotate(270 965 965)"/>
      <circle cx="965" cy="965" r="270"/>
      <circle cx="965" cy="965" r="195"/>
    </g>

    <!-- Small flower: 8 rounded petals around a ringed centre, centred on 0,0 -->
    <path id="small-petal" d="M63,-20 L96,-34 Q110,-38 112,-24 Q114,0 112,24 Q110,38 96,34 L63,20 A66,66 0 0 0 63,-20 Z"/>
    <g id="small-flower" fill="none" stroke="#ff0000" stroke-width="3.1" stroke-linejoin="round" stroke-linecap="round">
      <g transform="scale(0.92)">
        <circle r="58"/>
        <circle r="44"/>
        <use href="#small-petal" transform="rotate(22.5)"/>
        <use href="#small-petal" transform="rotate(67.5)"/>
        <use href="#small-petal" transform="rotate(112.5)"/>
        <use href="#small-petal" transform="rotate(157.5)"/>
        <use href="#small-petal" transform="rotate(202.5)"/>
        <use href="#small-petal" transform="rotate(247.5)"/>
        <use href="#small-petal" transform="rotate(292.5)"/>
        <use href="#small-petal" transform="rotate(337.5)"/>
      </g>
    </g>
  </defs>

  <!-- Same layout as rumduol.svg: big flowers on every 668 step (corners, edge middles, centre); small flowers at the quarter points -->
  <g id="big-flowers">
  <use href="#khmer-flower-motif" transform="translate(-309.8,-309.8) scale(0.321)"/>
  <use href="#khmer-flower-motif" transform="translate(-309.8,358.2) scale(0.321)"/>
  <use href="#khmer-flower-motif" transform="translate(-309.8,1026.2) scale(0.321)"/>
  <use href="#khmer-flower-motif" transform="translate(358.2,-309.8) scale(0.321)"/>
  <use href="#khmer-flower-motif" transform="translate(358.2,358.2) scale(0.321)"/>
  <use href="#khmer-flower-motif" transform="translate(358.2,1026.2) scale(0.321)"/>
  <use href="#khmer-flower-motif" transform="translate(1026.2,-309.8) scale(0.321)"/>
  <use href="#khmer-flower-motif" transform="translate(1026.2,358.2) scale(0.321)"/>
  <use href="#khmer-flower-motif" transform="translate(1026.2,1026.2) scale(0.321)"/>
  </g>
  <g id="small-flowers">
  <use href="#small-flower" x="334" y="334"/>
  <use href="#small-flower" x="334" y="1002"/>
  <use href="#small-flower" x="1002" y="334"/>
  <use href="#small-flower" x="1002" y="1002"/>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
